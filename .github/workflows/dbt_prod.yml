name: dbt build (prod)

"on":
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC (04:00 winter, 05:00 zomer)

concurrency:
  group: dbt-prod
  cancel-in-progress: false

jobs:
  dbt:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
      AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
      AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
      AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-sqlserver

      - name: Write profiles.yml (prod)
        run: |
          mkdir -p "${DBT_PROFILES_DIR}"
          cat > "${DBT_PROFILES_DIR}/profiles.yml" << 'EOF'
          horseflex:
            target: prod
            outputs:
              prod:
                type: sqlserver
                driver: 'ODBC Driver 18 for SQL Server'
                server: "{{ env_var('AZURE_SQL_SERVER') }}"
                port: 1433
                database: "{{ env_var('AZURE_SQL_DATABASE') }}"
                schema: dbo
                authentication: sql
                username: "{{ env_var('AZURE_SQL_USERNAME') }}"
                password: "{{ env_var('AZURE_SQL_PASSWORD') }}"
                encrypt: true
                trust_cert: false
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt build (prod)
        run: dbt build --target prod